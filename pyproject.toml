[project]
name = "specboard"
version = "0.1.0"
description = "LLM-powered motherboard specification extractor"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "pydantic",
    "requests",
    "beautifulsoup4",
    "ddgs",
    "playwright",
]

[tool.setuptools]
py-modules = ["specboard", "fetcher", "extractor", "validator", "spec_merger", "schemas", "cache"]

[project.scripts]
specboard = "specboard:main"
